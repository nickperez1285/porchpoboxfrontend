<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Porch Safety Score — free embeddable widget</title>
<meta name="description" content="Free embeddable porch safety score widget. Rate how protected your packages are against porch pirates and get a linkable result." />
<style>
  :root { --navy:#102b55; --blue:#2f6fed; --light:#eef4ff; --border:#d8e2f2; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background:#f7faff; color:#1c2b3a; padding:20px; }
  .widget { max-width:420px; margin:0 auto; background:#fff; border:1px solid var(--border); border-radius:16px; box-shadow:0 12px 30px rgba(16,43,85,.08); overflow:hidden; }
  .widget-head { background:linear-gradient(135deg,var(--navy),var(--blue)); color:#fff; padding:18px 20px; }
  .widget-head h1 { font-size:18px; font-weight:800; }
  .widget-head p { font-size:13px; opacity:.85; margin-top:4px; }
  .widget-body { padding:20px; }
  .q { margin-bottom:16px; }
  .q label { display:block; font-size:14px; font-weight:700; color:var(--navy); margin-bottom:8px; }
  .q select { width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; font-size:14px; background:#fff; }
  .btn { width:100%; padding:12px; border:none; border-radius:10px; background:var(--blue); color:#fff; font-size:15px; font-weight:800; cursor:pointer; }
  .btn:hover { filter:brightness(1.08); }
  .result { text-align:center; padding:8px 0; }
  .score { font-size:52px; font-weight:900; color:var(--navy); }
  .score-label { font-size:15px; font-weight:700; margin-top:4px; }
  .verdict { margin-top:10px; font-size:14px; line-height:1.6; color:#3a4a5e; }
  .cta { display:inline-block; margin-top:14px; padding:10px 18px; background:var(--navy); color:#fff; text-decoration:none; border-radius:10px; font-size:14px; font-weight:800; }
  .cta:hover { background:var(--blue); }
  .widget-foot { text-align:center; font-size:12px; color:#7a8aa0; padding:12px; border-top:1px solid var(--border); }
  .widget-foot a { color:var(--blue); font-weight:700; text-decoration:none; }
  .back { display:inline-block; margin-bottom:12px; font-size:12px; color:var(--blue); font-weight:700; text-decoration:none; }
</style>
</head>
<body>
  <div class="widget">
    <div class="widget-head">
      <h1>Porch Safety Score</h1>
      <p>How protected are your packages from porch pirates?</p>
    </div>
    <div class="widget-body">
      <div id="quiz">
        <div class="q">
          <label for="q1">Where are your packages delivered?</label>
          <select id="q1">
            <option value="0">Left on my doorstep</option>
            <option value="4">Hidden spot on my property</option>
            <option value="8">An attended secure location (locker, partner, work)</option>
          </select>
        </div>
        <div class="q">
          <label for="q2">Do you use package-tracking alerts?</label>
          <select id="q2">
            <option value="0">No</option>
            <option value="3">Sometimes</option>
            <option value="5">Yes, always</option>
          </select>
        </div>
        <div class="q">
          <label for="q3">Do you have a doorbell camera or security camera?</label>
          <select id="q3">
            <option value="0">No</option>
            <option value="3">Yes, one at the door</option>
            <option value="5">Yes, covering the whole entry</option>
          </select>
        </div>
        <div class="q">
          <label for="q4">Can you require signatures on high-value deliveries?</label>
          <select id="q4">
            <option value="0">No</option>
            <option value="3">Usually</option>
            <option value="5">Yes, always</option>
          </select>
        </div>
        <div class="q">
          <label for="q5">Do you have a porch lockbox or delivery box?</label>
          <select id="q5">
            <option value="0">No</option>
            <option value="3">Planning to get one</option>
            <option value="5">Yes, locked and bolted down</option>
          </select>
        </div>
        <div class="q">
          <label for="q6">Is there someone to take packages in quickly?</label>
          <select id="q6">
            <option value="0">Usually nobody is home</option>
            <option value="3">Sometimes</option>
            <option value="5">Always (me, partner, or trusted neighbor)</option>
          </select>
        </div>
        <button class="btn" onclick="calc()">Calculate My Score</button>
      </div>
      <div id="result" class="result" style="display:none">
        <div class="score" id="score">0</div>
        <div class="score-label" id="scoreLabel">/ 30</div>
        <div class="verdict" id="verdict"></div>
        <a class="cta" href="https://porchpobox.com/stop-porch-pirates">See 10 ways to stop porch pirates</a>
      </div>
    </div>
    <div class="widget-foot">
      Score provided by <a href="https://porchpobox.com">Porch P.O. Box</a> — secure package receiving.
    </div>
  </div>

<script>
  function calc() {
    var ids = ["q1","q2","q3","q4","q5","q6"];
    var total = 0;
    ids.forEach(function(id){ total += parseInt(document.getElementById(id).value,10) || 0; });
    document.getElementById("score").textContent = total;
    document.getElementById("scoreLabel").textContent = "/ 30";
    var verdict;
    if (total >= 24) verdict = "Strong protection. Your packages are unlikely to be stolen. For total peace of mind, route deliveries to an attended location and they never sit on a porch at all.";
    else if (total >= 15) verdict = "Moderate protection. You have some defense, but packages are still at risk. Add a secure delivery spot or a trusted pickup location.";
    else verdict = "High risk. Your packages are exposed to porch pirates. A camera helps, but the surest fix is delivering to a secure, attended location.";
    document.getElementById("verdict").textContent = verdict;
    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";
  }
</script>
</body>
</html>
